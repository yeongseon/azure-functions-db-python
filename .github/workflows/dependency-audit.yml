name: Dependency Audit

# Reporting only: the blocking gate is `runtime-dependency-audit` in publish-pypi.yml.
# Both run the same `make audit-wheel` target.

on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: Audit resolved dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel

      - name: Audit the wheel's runtime closure
        continue-on-error: true
        run: make audit-wheel WHEEL="$(ls dist/*.whl)"
