name: DB Integration Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "Makefile"
      - ".github/workflows/db-integration.yml"
      - "pyproject.toml"
      - "*.lock"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "Makefile"
      - ".github/workflows/db-integration.yml"
      - "pyproject.toml"
      - "*.lock"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres, mysql, mssql]

    services:
      postgres:
        image: ${{ matrix.db == 'postgres' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser -d testdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      mysql:
        image: ${{ matrix.db == 'mysql' && 'mysql:8' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: testdb
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u testuser -ptestpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      mssql:
        image: ${{ matrix.db == 'mssql' && 'mcr.microsoft.com/mssql/server:2022-latest' || '' }}
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "TestPass1!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'TestPass1!' -C -Q 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10


    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Azurite for the required managed checkpoint-store lane
        run: npm install -g azurite

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ODBC driver (MSSQL only)
        if: matrix.db == 'mssql'
        run: |
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          curl -fsSL https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 mssql-tools18 unixodbc-dev

      - name: Create MSSQL test database
        if: matrix.db == 'mssql'
        run: |
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'TestPass1!' -C -Q "CREATE DATABASE testdb"

      - name: Install package with all extras
        run: make install-ci

      - name: Set test DB URL
        run: |
          case "${{ matrix.db }}" in
            sqlite)
              echo "TEST_SQLITE_URL=sqlite:///$(pwd)/test_integration.db" >> "$GITHUB_ENV"
              ;;
            postgres)
              echo "TEST_POSTGRES_URL=postgresql+psycopg://testuser:testpass@localhost:5432/testdb" >> "$GITHUB_ENV"
              ;;
            mysql)
              echo "TEST_MYSQL_URL=mysql+pymysql://testuser:testpass@localhost:3306/testdb" >> "$GITHUB_ENV"
              ;;
            mssql)
              echo "TEST_MSSQL_URL=mssql+pyodbc://sa:TestPass1!@localhost:1433/testdb?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Run integration tests
        run: python -m tools.verification backend "${{ matrix.db }}"

      - name: Run Azurite tests
        # Required in every backend cell; never optional or an Azure certificate.
        run: python -m tools.verification backend azurite --owned

      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-report-${{ matrix.db }}-${{ github.run_id }}
          path: test-results/**
          retention-days: 14
