name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run lightweight tests
        run: |
          pip install hatch
          pip install -e ".[dev]"
          pytest -v -m "not integration and not azurite and not host_e2e and not azure_e2e" --no-cov --maxfail=3 --disable-warnings

      - name: Check if tag matches __version__
        run: |
          TAG_NAME="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          VERSION_FROM_FILE=$(grep -Po '(?<=__version__ = ")[^"]*' src/azure_functions_db/__init__.py)
          TAG_VERSION=${TAG_NAME#v}
          echo "Version from file: $VERSION_FROM_FILE"
          echo "Tag name: $TAG_NAME"
          echo "Version from tag: $TAG_VERSION"
          if [ "$VERSION_FROM_FILE" != "$TAG_VERSION" ]; then
            echo "::error ::Version in __init__.py ($VERSION_FROM_FILE) does not match git tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Build distribution packages
        run: |
          pip install hatch
          hatch build --clean

      - name: Publish to PyPI
        # Documented exception to the SHA-pinning policy: PyPA officially
        # recommends pinning to the rolling `release/v1` branch. See
        # CONTRIBUTING.md "GitHub Actions Pinning" for rationale.
        uses: pypa/gh-action-pypi-publish@release/v1
