name: Test and Coverage

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      docs_changed: ${{ steps.classify.outputs.docs_changed }}
      full_required: ${{ steps.classify.outputs.full_required }}
    steps:
      - name: Checkout trusted classifier revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && github.event.pull_request.base.sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Classify changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          tools/ci_classify_event.sh "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.full_required == 'true'
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Assert the runtime interpreter matches the matrix cell
        # Belt-and-braces: the tests below run *directly* on this interpreter
        # via `python -m pytest` (NOT through the default pinned Hatch env),
        # so every matrix cell genuinely exercises its advertised interpreter.
        env:
          EXPECTED: ${{ matrix.python-version }}
        run: |
          python - <<'PY'
          import os, sys
          expected = tuple(int(p) for p in os.environ["EXPECTED"].split("."))
          actual = sys.version_info[: len(expected)]
          assert actual == expected, f"interpreter {actual} != matrix {expected}"
          print(f"interpreter OK: {sys.version.split()[0]}")
          PY

      - name: Install package with dev extras on the matrix interpreter
        # Editable install builds the package from source on each matrix
        # interpreter (the 3.13/3.14 wheel/build lane) and pulls the dev extra
        # (pytest, pytest-cov) so tests run on the real interpreter.
        run: make install-ci

      - name: Run tests on the matrix interpreter
        # coverage.xml is emitted automatically via pytest addopts (--cov ...).
        run: python -m tools.verification test

      - name: Verify coverage output
        run: ls -lh test-results/test/coverage.xml

      - name: Retain coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python-3.11
          path: test-results/test/coverage.xml
          if-no-files-found: error

      - name: Report skipped Codecov upload
        if: matrix.python-version == '3.11' && github.event_name == 'push' && github.actor != 'dependabot[bot]' && env.CODECOV_TOKEN == ''
        run: |
          echo "::warning title=Codecov upload skipped::CODECOV_TOKEN is not configured for this repository; coverage.xml is retained as a workflow artifact."
          echo "### Codecov upload skipped (CODECOV_TOKEN is not configured)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11' && github.event_name == 'push' && github.actor != 'dependabot[bot]' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./test-results/test/coverage.xml
          verbose: true
          fail_ci_if_error: true
        env:
          CODECOV_RETRIES: 3

      - name: Upload offline verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-evidence-py${{ matrix.python-version }}
          path: test-results/**

  quality:
    # Lint, type-check, workflow-lint and security run once on the single
    # selected interpreter (3.11) -- these are interpreter-agnostic
    # gates, so running them per matrix cell would only duplicate reporting.
    needs: changes
    if: needs.changes.outputs.full_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The changed-file format check below diffs against the PR merge-base,
          # which a shallow clone does not contain.
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install selected-interpreter quality dependencies
        run: make install-ci

      - name: Complete non-mutating quality gate
        run: make check

      - name: Ruff format check (changed Python files)
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: make format-check-changed BASE="$PR_BASE_SHA" HEAD="$PR_HEAD_SHA"

  sqlalchemy-latest-types:
    needs: changes
    if: needs.changes.outputs.full_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install accepted SQLAlchemy upper edge
        run: pip install -e ".[dev]" --upgrade-strategy eager

      - name: Show resolved SQLAlchemy version
        run: pip show sqlalchemy

      - name: Type check against latest accepted SQLAlchemy
        run: make typecheck

  shellcheck:
    needs: changes
    if: needs.changes.outputs.full_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint shell scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck examples/postgresql-poll-trigger/smoke.sh examples/mysql-poll-trigger/smoke.sh

  minimum-dependencies:
    name: Minimum dependencies (Py 3.11)
    needs: changes
    if: needs.changes.outputs.full_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install minimum runtime and development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "azure-functions==1.21.0" "sqlalchemy==2.0.0"
          pip install -e ".[dev]"

      - name: Assert declared runtime dependency floors are resolved
        run: |
          pip show azure-functions sqlalchemy azure-functions-db
          python - <<'PY'
          from importlib.metadata import version

          resolved = {
              "azure-functions": version("azure-functions"),
              "sqlalchemy": version("sqlalchemy"),
          }
          print(f"resolved dependencies={resolved}")
          assert resolved == {"azure-functions": "1.21.0", "sqlalchemy": "2.0.0"}
          PY

      - name: Run full suite against minimum runtime dependencies
        run: python -m tools.verification test --no-cov

      - name: Upload minimum-dependency evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minimum-dependency-evidence
          path: test-results/**

  artifact-build:
    name: Build compatibility artifacts
    needs: changes
    if: needs.changes.outputs.full_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload compatibility artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatibility-dist
          path: dist/
          if-no-files-found: error

  artifact-python310-negative:
    name: Wheel install rejection (Py 3.10, negative test)
    needs: [changes, artifact-build]
    if: needs.changes.outputs.full_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.10 for negative install test
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Download built artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compatibility-dist
          path: compatibility-dist

      - name: Require wheel rejection by Requires-Python
        run: |
          wheel=$(find compatibility-dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          if output=$(python -m pip install --no-deps "$wheel" 2>&1); then
            echo "::error ::Python 3.10 unexpectedly installed the candidate wheel"
            exit 1
          fi
          printf '%s\n' "$output"
          grep -F "requires a different Python" <<<"$output"
          grep -F "3.10" <<<"$output"
          grep -F ">=3.11" <<<"$output"

  artifact-python311:
    name: Wheel install and SQLite smoke (Py 3.11)
    needs: [changes, artifact-build]
    if: needs.changes.outputs.full_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Download built artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compatibility-dist
          path: compatibility-dist

      - name: Install wheel with runtime dependencies
        run: |
          wheel=$(find compatibility-dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          python -m pip install "$wheel"

      - name: Check installed wheel outside the checkout
        working-directory: /tmp
        env:
          CHECKOUT: ${{ github.workspace }}
        run: |
          python -m pip check
          python - <<'PY'
          import os
          from pathlib import Path

          import azure_functions_db
          from azure_functions_db import DbReader, DbWriter
          from sqlalchemy import Column, Integer, MetaData, String, Table, create_engine

          module_path = Path(azure_functions_db.__file__).resolve()
          checkout = Path(os.environ["CHECKOUT"]).resolve()
          print(f"imported module: {module_path}")
          assert not module_path.is_relative_to(checkout)

          database = Path("artifact-smoke.sqlite")
          url = f"sqlite:///{database}"
          metadata = MetaData()
          Table(
              "items",
              metadata,
              Column("id", Integer, primary_key=True),
              Column("name", String, nullable=False),
          )
          metadata.create_all(create_engine(url))
          with DbWriter(url=url, table="items") as writer:
              writer.insert(data={"id": 1, "name": "installed-wheel"})
          with DbReader(url=url, table="items") as reader:
              assert reader.get(pk={"id": 1}) == {"id": 1, "name": "installed-wheel"}
          PY

  host-smoke:
    name: Functions host smoke (Py ${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.full_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Functions host, Azurite, and checkout package
        run: |
          npm install --global azure-functions-core-tools@4 azurite --unsafe-perm true
          make install-ci

      - name: Run real Functions host smoke
        run: make host-smoke

      - name: Upload real host evidence (not Azure certification)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-evidence-py${{ matrix.python-version }}
          path: test-results/**

  # azure-functions 2.x compatibility proof lane (issue #287), following the
  # sibling proof-lane pattern (azure-functions-openapi #508/#525,
  # azure-functions-langgraph #350, azure-functions-validation #348). This is a
  # SINGLE representative 2.x lane, not a matrix: it builds a WHEEL, installs it,
  # then deliberately overrides the pyproject `<2.0.0` cap to pull
  # `azure-functions>=2,<3` on Python 3.13 and runs the full suite against the
  # 2.x SDK. This package is a runtime consumer of `azure-functions`
  # (input/output/client injection, poll-based pseudo trigger), so binding-type
  # behaviour under the 2.x worker is the risk surface this lane exercises.
  #
  # Gating decision: this lane runs on every PR as a VISIBLE compatibility
  # signal, but it is intentionally NOT a required check -- pyproject already
  # permits the 2.x line on Python 3.13+, yet this package's own real-Azure
  # certification via e2e-azure.yml is still a follow-up, so making this lane
  # blocking would gate merges on a runtime this repository has not certified.
  # Promote it to a required check via branch protection once that
  # certification lands. azure-functions 2.x declares Requires-Python >=3.13,
  # so this lane pins Python 3.13.
  azure-functions-2x:
    name: azure-functions 2.x compat (Py 3.13)
    needs: changes
    if: needs.changes.outputs.full_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build wheel
        # Prove 2.x against a WHEEL-installed build, not an editable/source tree,
        # mirroring the sibling proof lanes. Building the distribution artifact
        # also avoids Hatch's default env, which is pinned to Python 3.11 in
        # pyproject and cannot install azure-functions 2.x (Requires-Python
        # >=3.13).
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: Install wheel with dev extras
        run: pip install "$(ls dist/azure_functions_db-*.whl)[dev]"

      - name: Upgrade azure-functions to the 2.x line
        # pyproject caps azure-functions below 2.0.0 only on Python <3.13; on
        # the 3.13 interpreter this lane runs, the 2.x line is already
        # permitted. Pinning >=2,<3 explicitly fixes the line under test to
        # PROVE the package (binding decorators, poll trigger, writer
        # injection) still builds and passes its suite under 2.x. pip may warn
        # about resolving to 2.x; that is expected.
        run: pip install "azure-functions>=2,<3"

      - name: Show resolved versions
        run: pip show azure-functions sqlalchemy pydantic | grep -E '^(Name|Version):'

      - name: Run compat suite against the wheel + azure-functions 2.x
        # Compatibility smoke only: `--no-cov` disables the coverage gate for this
        # pinned run (a separate job from the coverage-enforcing matrix). The repo
        # pytest config sets `pythonpath = ["src", "."]`, which would shadow the
        # installed wheel with the source tree. We drop `src` (so the
        # wheel-installed package is genuinely exercised) but keep the repo root
        # `.` on the path for conftest/fixtures.
        run: python -m tools.verification test --no-cov -q -o "pythonpath=."

  docs-check:
    needs: changes
    if: needs.changes.outputs.docs_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install docs and test dependencies
        run: python -m pip install -e ".[docs]" pytest pytest-cov

      - name: Build docs strictly
        run: make docs

      - name: Upload documentation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-evidence
          path: test-results/**

      - name: Run documentation drift tests
        run: >-
          pytest --no-cov
          tests/test_docs_metric_drift.py
          tests/test_docs_pip_install_drift.py
          tests/test_docs_i18n_async_drift.py

  # The single required status check for branch protection.
  #
  # Branch protection matches required checks by literal name, so requiring
  # matrix cells couples it to the matrix: dropping a version removes the job
  # that produced that name, the check is then never reported, and GitHub holds
  # it pending forever -- blocking every PR, Dependabot and Release Please
  # included, until an admin edits settings.
  #
  # This job's name survives matrix changes. `if: always()` guarantees it always
  # reports, and it reads every dependency's result, so a skipped or cancelled
  # job cannot pass by not being a failure.
  ci-required:
    needs:
      - changes
      - docs-check
      - quality
      - test
      - minimum-dependencies
      - artifact-build
      - artifact-python310-negative
      - artifact-python311
      - shellcheck
      - host-smoke
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && github.event.pull_request.base.sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Evaluate required checks
        env:
          RESULTS: ${{ toJSON(needs) }}
          FULL_REQUIRED: ${{ needs.changes.outputs.full_required }}
          DOCS_CHANGED: ${{ needs.changes.outputs.docs_changed }}
        run: |
          python3 tools/ci_required_gate.py
